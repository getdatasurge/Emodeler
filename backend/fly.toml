# Fly.io config for the EnergyModeler API. Deploy from this directory:
#   cd backend && fly launch --copy-config --name <your-app> --no-deploy && fly deploy
# (Run `fly launch` so the build context is backend/ — matching the Dockerfile.)
app = "energymodeler-api"          # change to a globally-unique app name
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/energy_modeler.db"
  STORAGE_DIR = "/data/storage"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

# For persistence across restarts, create a volume and mount it at /data:
#   fly volumes create data --size 1
# [mounts]
#   source = "data"
#   destination = "/data"
